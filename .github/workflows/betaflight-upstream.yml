name: Betaflight upstream baseline

on:
  push:
    branches:
      - 'development/betaflight-full-compatibility'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  verify-pinned-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Verify upstream provenance
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="e0b7bb01b17b21351057e9ead2d1ab39dd44fa16"
          expected_url="https://github.com/betaflight/betaflight.git"
          actual_url="$(git config -f .gitmodules --get submodule.upstream/betaflight.url)"
          test "$actual_url" = "$expected_url"
          entry="$(git ls-tree HEAD upstream/betaflight)"
          read -r mode type sha _ <<< "$entry"
          test "$mode" = "160000"
          test "$type" = "commit"
          test "$sha" = "$expected_sha"
      - name: Fetch exactly pinned upstream revision
        run: git submodule update --init --depth 1 upstream/betaflight
      - name: Verify upstream source layout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/betaflight rev-parse HEAD)" = "e0b7bb01b17b21351057e9ead2d1ab39dd44fa16"
          test -f upstream/betaflight/Makefile
          test -f upstream/betaflight/LICENSE
          test -d upstream/betaflight/src/main/drivers
          test -d upstream/betaflight/src/platform
          echo "Pinned official Betaflight source verified; no firmware migration implied."
